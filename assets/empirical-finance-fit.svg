<svg xmlns="http://www.w3.org/2000/svg" width="900" height="442" viewBox="0 0 900 442" role="img" aria-labelledby="title desc">
<title id="title">Adjusted R-squared: CAPM versus the Fama–French five-factor model</title>
<desc id="desc">In-sample adjusted R-squared increases across five U.S. industry portfolios: Oil 37.4 to 45.3 percent; Banks 62.9 to 74.4; Textiles 46.1 to 63.0; Toys 51.7 to 59.4; Retail 68.1 to 70.3. Data from a separate public Python reconstruction, July 1963 through June 2026.</desc>

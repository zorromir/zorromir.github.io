<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Model comparison: adjusted R-squared by industry</title>
<desc id="desc">For each of five industry portfolios, the FF5 adjusted R-squared is above the CAPM adjusted R-squared. Oil 37.4 versus 45.3 percent; Banks 62.9 versus 74.3; Textiles 46.1 versus 63.0; Toys 51.7 versus 59.4; Retail 68.1 versus 70.3.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#20343a}.head{font-family:Georgia,serif;font-size:27px}.sub{font-size:12px;fill:#53666a}.industry{font-size:15px;font-weight:600}.value{font-size:12px;fill:#20343a;font-weight:600}.tick{font-size:12px;fill:#738488}.legend{font-size:13px}</style>

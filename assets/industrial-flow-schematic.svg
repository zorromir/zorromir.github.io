4" fill="#2c6770"/><g stroke="#29444b" stroke-width="3" fill="#eff3ef"><path d="M200 148 V110 M460 148 V110 M765 148 V110 M1010 148 V110"/><circle cx="200" cy="99" r="11"/><circle cx="460" cy="99" r="11"/><circle cx="765" cy="99" r="11"/><circle cx="1010" cy="99" r="11"/></g><g font-family="Arial,sans-serif" font-weight="bold"><text x="220" y="125" font-size="14" fill="#526c72">Pressure sensors</text><text x="204" y="218" font-size="17" fill="#466469">AIR</text><text x="720" y="222" font-size="19" fill="#f5f9f7">LIQUID COLUMN</text><text x="1140" y="156" font-size="13" fill="#466469">Outlet</text><path d="M535 256 V280 H587" stroke="#29444b" stroke-width="1.5" fill="none"/><text x="598" y="284" font-size="15" fill="#29444b">Moving air–water interface</text><path d="M380 239 V304 H460" stroke="#29444b" stroke-width="1.5" fill="none"/><text x="472" y="308" font-size="15" fill="#29444b">Residual liquid film / holdup</text><text x="100" y="339" font-size="13" fill="#61777b">Illustration of the published rigid-column model, not experimental imaging</text></g></svg>
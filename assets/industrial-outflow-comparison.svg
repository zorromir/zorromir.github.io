<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="535" viewBox="0 0 1080 535" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">Measured versus modelled liquid outflow from the public Delft benchmark</title><desc id="chartdesc">Measured outflow rises from 0.051 cubic metres per second at time zero to approximately 0.35 at 44 seconds, then falls. The simple measurement-driven numerical model starts at zero and rises more slowly. The two do not agree sufficiently for a validated-fit claim.</desc><rect width="1080" height="535" rx="10" fill="#f8faf8"/><rect x="87" y="125" width="922" height="305" fill="#fff" stroke="#d9e4dc"/><g font-family="Arial,sans-serif"><line x1="88" x2="1008" y1="430" y2="430" stroke="#dce6e0"/><text x="75" y="434" font-size="14" text-anchor="end" fill="#60757a">0.0</text><line x1="88" x2="1008" y1="353.75" y2="353.75" stroke="#dce6e0"/><text x="75" y="357.75" font-size="14" text-anchor="end" fill="#60757a">0.1</text><line x1="88" x2="1008" y1="277.5" y2="277.5" stroke="#dce6e0"/><text x="75" y="281.5" font-size="14" text-anchor="end" fill="#60757a">0.2</text><line x1="88" x2="1008" y1="201.25" y2="201.25" stroke="#dce6e0"/><text x="75" y="205.25" font-size="14" text-anchor="end" fill="#60757a">0.3</text><line x1="88" x2="1008" y1="125" y2="125" stroke="#dce6e0"/><text x="75" y="129" font-size="14" text-anchor="end" fill="#60757a">0.4</text><line x1="88" x2="88" y1="125" y2="430" stroke="#edf1ed"/><text x="88" y="456" font-size="14" text-anchor="middle" fill="#60757a">0</text><line x1="252.28571428571428" x2="252.28571428571428" y1="125" y2="430" stroke="#edf1ed"/><text x="252.28571428571428" y="456" font-size="14" text-anchor="middle" fill="#60757a">10</text><line x1="416.57142857142856" x2="416.57142857142856" y1="125" y2="430" stroke="#edf1ed"/><text x="416.57142857142856" y="456" font-size="14" text-anchor="middle" fill="#60757a">20</text><line x1="580.8571428571429" x2="580.8571428571429" y1="125" y2="430" 
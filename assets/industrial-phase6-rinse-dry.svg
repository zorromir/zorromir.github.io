<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445" role="img" aria-labelledby="t d"><title id="t">Rinse to Dry water inventory, model-derived illustrative trajectories</title><desc id="d">Original calculated water inventory from a synthetic three-compartment Rinse water-product balance passes at 60 seconds into a simple first-order Dry model. The water inventory rises to 31.824 litres and declines to 3.1824 litres at an illustrative 90-percent removal threshold. No experiment data or equipment parameters are used.</desc><rect width="1000" height="445" fill="#f8faf8"/><g font-family="Arial,Helvetica,sans-serif"><text x="101" y="25" fill="#24766e" font-weight="bold" font-size="11" letter-spacing="1.5">PHASE 6 / ORIGINAL NUMERICAL OUTPUT · SYNTHETIC INPUTS</text><text x="101" y="61" font-size="23" font-weight="bold" fill="#20343a">Rinse to Dry: remaining water in the pipe</text><rect x="101" y="116" width="829" height="250" fill="#ffffff" stroke="#dbe4e0"/><line x1="101" x2="930" y1="366.0" y2="366.0" stroke="#dbe4e0"/><text x="85" y="371.0" font-size="13" fill="#53666a" text-anchor="end">0</text><line x1="101" x2="930" y1="330.3" y2="330.3" stroke="#dbe4e0"/><text x="85" y="335.3" font-size="13" fill="#53666a" text-anchor="end">5</text><line x1="101" x2="930" y1="294.5" y2="294.5" stroke="#dbe4e0"/><text x="85" y="299.5" font-size="13" fill="#53666a" text-anchor="end">10</text><line x1="101" x2="930" y1="258.8" y2="258.8" stroke="#dbe4e0"/><text x="85" y="263.8" font-size="13" fill="#53666a" text-anchor="end">15</text><line x1="101" x2="930" y1="223.0" y2="223.0" stroke="#dbe4e0"/><text x="85" y="228.0" font-size="13" fill="#53666a" text-anchor="end">20</text><line x1="101" x2="930" y1="187.3" y2="187.3" stroke="#dbe4e0"/><text x="85" y="192.3" font-size="13" fill="#53666a" text-anchor="end">25</text><line x1="101" x2="930" y1="151.5" y2="151.5" stroke="#dbe4e0"/><text x="85" y="156.5" font-size="13" fill="#53666a" text-anchor="en
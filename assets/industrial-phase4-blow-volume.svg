<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="443" viewBox="0 0 1000 443" role="img" aria-labelledby="title desc"><title id="title">Blow transition simulated liquid-volume partition</title><desc id="desc">Original numerical integration of a uniform-pipe liquid-column control-volume model with hypothetical inputs. A shrinking full liquid column is partitioned into product discharged and liquid retained behind its moving interface. The sum is constant to numerical accuracy. Not experimental data.</desc><rect width="1000" height="443" fill="#f8faf8"/><g font-family="Arial,Helvetica,sans-serif"><text x="95" y="24" fill="#24766e" font-size="12" font-weight="bold" letter-spacing="1.4">PHASE 4 / HYPOTHETICAL NUMERICAL MODEL</text><text x="95" y="57" fill="#20343a" font-size="23" font-weight="bold">Blow transition: where the liquid goes</text><rect x="95" y="109" width="840" height="254" fill="#fff" stroke="#dbe4e0"/><line x1="95" y1="363" x2="935" y2="363" stroke="#dbe4e0"/><text x="78" y="368" font-size="14" text-anchor="end" fill="#53666a">0.0</text><line x1="95" y1="312.2" x2="935" y2="312.2" stroke="#dbe4e0"/><text x="78" y="317.2" font-size="14" text-anchor="end" fill="#53666a">0.2</text><line x1="95" y1="261.4" x2="935" y2="261.4" stroke="#dbe4e0"/><text x="78" y="266.4" font-size="14" text-anchor="end" fill="#53666a">0.4</text><line x1="95" y1="210.6" x2="935" y2="210.6" stroke="#dbe4e0"/><text x="78" y="215.6" font-size="14" text-anchor="end" fill="#53666a">0.6</text><line x1="95" y1="159.79999999999998" x2="935" y2="159.79999999999998" stroke="#dbe4e0"/><text x="78" y="164.79999999999998" font-size="14" text-anchor="end" fill="#53666a">0.8</text><line x1="95" y1="109" x2="935" y2="109" stroke="#dbe4e0"/><text x="78" y="114" font-size="14" text-anchor="end" fill="#53666a">1.0</text><line x1="95" y1="109" x2="95" y2="363" stroke="#edf3ef"/><text x="95" y="388" font-size="14" text-anchor="middle" fill="#53666a">0</text><line x1="235" y1="109" x2="235" 
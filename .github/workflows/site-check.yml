name: Portfolio integrity checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Check pages, assets and research figures
        run: python3 tests/site_check.py
      - name: Check JavaScript syntax
        run: node --check app.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check all six pages on desktop, tablet and mobile
        run: python tests/browser_check.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-portfolio-screenshots
          path: artifacts/qa/
          if-no-files-found: ignore
          retention-days: 14
